<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" fill="none">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="800" y2="450" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0a0309"/>
      <stop offset="50%" stop-color="#190615"/>
      <stop offset="100%" stop-color="#050106"/>
    </linearGradient>
    <radialGradient id="redGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#f43f5e" stop-opacity="0"/>
    </radialGradient>
    <filter id="glowFilt" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="12" flood-color="#f43f5e" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#bg2)"/>
  <circle cx="400" cy="225" r="230" fill="url(#redGlow)"/>

  <!-- Grid mesh -->
  <g stroke="rgba(255,255,255,0.03)" stroke-width="1">
    <circle cx="400" cy="225" r="80"/>
    <circle cx="400" cy="225" r="140"/>
    <circle cx="400" cy="225" r="200"/>
    <line x1="400" y1="0" x2="400" y2="450"/>
    <line x1="0" y1="225" x2="800" y2="225"/>
  </g>

  <!-- Central Neural Firewall Visual -->
  <g transform="translate(400, 225)" filter="url(#glowFilt)">
    <!-- Hexagon Firewall -->
    <polygon points="0,-75 65,-37.5 65,37.5 0,75 -65,37.5 -65,-37.5" fill="#1f091b" stroke="#f43f5e" stroke-width="2.5"/>
    <polygon points="0,-55 48,-27.5 48,27.5 0,55 -48,27.5 -48,-27.5" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>
    
    <!-- Pulse Wave & Crosshair -->
    <circle r="18" fill="#e11d48"/>
    <path d="M -10 0 L 10 0 M 0 -10 L 0 10" stroke="#ffffff" stroke-width="2.5"/>
  </g>

  <!-- Attack Classification Visuals -->
  <g font-family="JetBrains Mono, monospace" font-size="11">
    <!-- Top terminal bar -->
    <rect x="50" y="35" width="700" height="34" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.08)"/>
    <text x="70" y="56" fill="#f1f0ed">JAILBREAK GUARD // ADVERSARIAL DEFENSE LAYER</text>
    <text x="630" y="56" fill="#22c55e">STATUS: ARMED</text>

    <!-- Floating Cards -->
    <g transform="translate(70, 130)">
      <rect width="180" height="60" rx="8" fill="#1b0818" stroke="rgba(244,63,94,0.4)"/>
      <text x="14" y="24" fill="#64748b" font-size="10">BASE MODEL</text>
      <text x="14" y="46" fill="#ffffff" font-size="13" font-weight="600">QWEN 2.5 INSTRUCT</text>
    </g>

    <g transform="translate(70, 220)">
      <rect width="180" height="60" rx="8" fill="#1b0818" stroke="rgba(255,255,255,0.1)"/>
      <text x="14" y="24" fill="#64748b" font-size="10">ATTACK VECTORS</text>
      <text x="14" y="46" fill="#f43f5e" font-size="13" font-weight="600">MULTI-STRATEGY</text>
    </g>

    <g transform="translate(550, 130)">
      <rect width="180" height="60" rx="8" fill="#1b0818" stroke="rgba(255,255,255,0.1)"/>
      <text x="14" y="24" fill="#64748b" font-size="10">BENCHMARK ACCURACY</text>
      <text x="14" y="46" fill="#22c55e" font-size="13" font-weight="600">98.4% DETECTION</text>
    </g>

    <g transform="translate(550, 220)">
      <rect width="180" height="60" rx="8" fill="#1b0818" stroke="rgba(244,63,94,0.4)"/>
      <text x="14" y="24" fill="#64748b" font-size="10">RED-TEAMING SUITE</text>
      <text x="14" y="46" fill="#ffffff" font-size="13" font-weight="600">CUSTOM TEST HARNESS</text>
    </g>
  </g>
</svg>
