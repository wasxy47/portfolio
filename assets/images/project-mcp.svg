<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="800" y2="450" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#070312"/>
      <stop offset="50%" stop-color="#110722"/>
      <stop offset="100%" stop-color="#040108"/>
    </linearGradient>
    <linearGradient id="crimson" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#be123c"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e11d48" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#e11d48" stop-opacity="0"/>
    </radialGradient>
    <filter id="drop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#e11d48" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bg)"/>
  <circle cx="400" cy="225" r="220" fill="url(#glow)"/>

  <!-- Grid lines -->
  <g stroke="rgba(255,255,255,0.04)" stroke-width="1">
    <line x1="0" y1="90" x2="800" y2="90"/>
    <line x1="0" y1="180" x2="800" y2="180"/>
    <line x1="0" y1="270" x2="800" y2="270"/>
    <line x1="0" y1="360" x2="800" y2="360"/>
    <line x1="160" y1="0" x2="160" y2="450"/>
    <line x1="320" y1="0" x2="320" y2="450"/>
    <line x1="480" y1="0" x2="480" y2="450"/>
    <line x1="640" y1="0" x2="640" y2="450"/>
  </g>

  <!-- Central Shield / Gateway HUD -->
  <g transform="translate(400, 215)" filter="url(#drop)">
    <!-- Outer Shield Orbit -->
    <circle r="120" stroke="rgba(225,29,72,0.3)" stroke-width="1" stroke-dasharray="6 6"/>
    <circle r="145" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
    
    <!-- Shield Polygon -->
    <path d="M 0 -80 L 70 -35 L 70 30 C 70 85 0 115 0 115 C 0 115 -70 85 -70 30 L -70 -35 Z" fill="#140a28" stroke="url(#crimson)" stroke-width="2.5"/>
    
    <!-- Core Lock / Gateway Glyph -->
    <rect x="-24" y="-10" width="48" height="40" rx="6" fill="#e11d48"/>
    <path d="M -14 -10 V -24 C -14 -32 14 -32 14 -24 V -10" stroke="#ffffff" stroke-width="4" fill="none" stroke-linecap="round"/>
    <circle cx="0" cy="8" r="4" fill="#ffffff"/>
    <line x1="0" y1="12" x2="0" y2="20" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Code / Threat Indicators -->
  <g font-family="JetBrains Mono, monospace" font-size="11" fill="#9ca3af">
    <!-- Top Bar -->
    <rect x="50" y="35" width="700" height="34" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.08)"/>
    <circle cx="70" cy="52" r="5" fill="#f43f5e"/>
    <circle cx="86" cy="52" r="5" fill="#eab308"/>
    <circle cx="102" cy="52" r="5" fill="#22c55e"/>
    <text x="130" y="56" fill="#f1f0ed">MCP SENTINEL // INLINE SECURITY GATEWAY</text>
    <text x="630" y="56" fill="#e11d48">21 THREATS MITIGATED</text>

    <!-- Floating Metrics Badges -->
    <g transform="translate(70, 140)">
      <rect width="170" height="58" rx="8" fill="#150a2a" stroke="rgba(225,29,72,0.4)" stroke-width="1"/>
      <text x="14" y="24" fill="#64748b" font-size="10">POLICY ENGINE</text>
      <text x="14" y="44" fill="#ffffff" font-size="13" font-weight="600">CEDAR (WASM)</text>
    </g>

    <g transform="translate(70, 230)">
      <rect width="170" height="58" rx="8" fill="#150a2a" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
      <text x="14" y="24" fill="#64748b" font-size="10">AUDIT LOGGING</text>
      <text x="14" y="44" fill="#f43f5e" font-size="13" font-weight="600">SHA-256 CHAINED</text>
    </g>

    <g transform="translate(560, 140)">
      <rect width="170" height="58" rx="8" fill="#150a2a" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
      <text x="14" y="24" fill="#64748b" font-size="10">TEST COVERAGE</text>
      <text x="14" y="44" fill="#22c55e" font-size="13" font-weight="600">620+ AUTOMATED</text>
    </g>

    <g transform="translate(560, 230)">
      <rect width="170" height="58" rx="8" fill="#150a2a" stroke="rgba(225,29,72,0.4)" stroke-width="1"/>
      <text x="14" y="24" fill="#64748b" font-size="10">GOVERNANCE</text>
      <text x="14" y="44" fill="#ffffff" font-size="13" font-weight="600">HITL APPROVALS</text>
    </g>
  </g>
</svg>
