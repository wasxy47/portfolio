<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" fill="none">
  <defs>
    <linearGradient id="bg4" x1="0" y1="0" x2="800" y2="450" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#080312"/>
      <stop offset="50%" stop-color="#140728"/>
      <stop offset="100%" stop-color="#030109"/>
    </linearGradient>
    <radialGradient id="purpleGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bg4)"/>
  <circle cx="400" cy="225" r="230" fill="url(#purpleGlow)"/>

  <!-- Vector embeddings clustering schematic -->
  <g transform="translate(400, 220)">
    <!-- Central Query Vector -->
    <circle r="8" fill="#e11d48"/>
    <circle r="40" stroke="rgba(225,29,72,0.4)" stroke-width="1" stroke-dasharray="4 4"/>
    <circle r="90" stroke="rgba(168,85,247,0.3)" stroke-width="1" stroke-dasharray="6 6"/>

    <!-- Cluster Dots -->
    <circle cx="-50" cy="-35" r="5" fill="#a855f7"/>
    <circle cx="-65" cy="-20" r="4" fill="#a855f7"/>
    <circle cx="-80" cy="-45" r="6" fill="#a855f7"/>
    <circle cx="60" cy="-40" r="5" fill="#38bdf8"/>
    <circle cx="75" cy="-25" r="4" fill="#38bdf8"/>
    <circle cx="45" cy="55" r="6" fill="#4ade80"/>
    <circle cx="65" cy="65" r="4" fill="#4ade80"/>
    <circle cx="-55" cy="50" r="5" fill="#f59e0b"/>

    <!-- Distance Vectors -->
    <line x1="0" y1="0" x2="-50" y2="-35" stroke="#e11d48" stroke-width="1.5"/>
    <line x1="0" y1="0" x2="60" y2="-40" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
    <line x1="0" y1="0" x2="45" y2="55" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
  </g>

  <!-- Headers -->
  <g font-family="JetBrains Mono, monospace" font-size="11">
    <rect x="50" y="35" width="700" height="34" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.08)"/>
    <text x="70" y="56" fill="#f1f0ed">ENTERPRISE RAG // SEMANTIC VECTOR SEARCH</text>
    <text x="630" y="56" fill="#a855f7">FAISS + CHROMADB</text>

    <g transform="translate(70, 140)">
      <rect width="170" height="58" rx="8" fill="#140a24" stroke="rgba(168,85,247,0.4)"/>
      <text x="14" y="24" fill="#64748b" font-size="10">RETRIEVAL METHOD</text>
      <text x="14" y="44" fill="#ffffff" font-size="13" font-weight="600">HYBRID DENSE + BM25</text>
    </g>

    <g transform="translate(560, 140)">
      <rect width="170" height="58" rx="8" fill="#140a24" stroke="rgba(168,85,247,0.4)"/>
      <text x="14" y="24" fill="#64748b" font-size="10">INFRASTRUCTURE</text>
      <text x="14" y="44" fill="#38bdf8" font-size="13" font-weight="600">FASTAPI + AZURE</text>
    </g>
  </g>
</svg>
